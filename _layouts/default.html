<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
{% include head.html %}
<body>
<div class="page{% unless page.layout == "home" %} subpage{% endunless %}">
  {% include header.html %}
  {%- if page.plate %}
  {% include plate.html %}
  {%- endif %}
  <main id="main">
{{ content }}
  </main>
  {%- if page.plate %}
  <div class="jelly-spot"><div class="jelly-box">{% include jelly-link.html %}</div></div>
  {% include star-links.html %}
  {%- endif %}
</div>
{%- if page.layout == "home" %}
<script src="/assets/js/trails.js?v={{ site.time | date: '%s' }}" defer></script>
{%- endif %}
</body>
</html>
