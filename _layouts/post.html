---
layout: default
---
<article class="wrap">
  <div class="leaf">
    <p class="label"><a href="/blog/">writing</a></p>
    <div class="body">
      <h1>{{ page.title | escape }}</h1>
      <p class="muted"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time></p>
      <div class="prose">
{{ content }}
      </div>
    </div>
  </div>
</article>
