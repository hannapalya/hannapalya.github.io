# Site settings. Restart `jekyll serve` after editing this file.
title: Hanna Pálya
tagline: Researcher, Centre for the Governance of AI
description: >-
  Hanna Pálya is a researcher at the Centre for the Governance of AI, where she
  works on threat modelling for AI-enabled biological risks.
url: "https://hannapalya.com"
baseurl: ""
lang: en
locale: en_GB      # og:locale (language_TERRITORY); `lang` stays the <html lang>
email: hannapalya@gmail.com
repository: hannapalya/hannapalya.github.io

# No theme: the site has its own layouts. (GitHub Pages would otherwise apply jekyll-theme-primer.)
theme: null

author:
  name: Hanna Pálya
  url: https://hannapalya.com/
  twitter: hannapalya5   # twitter:creator; the same handle as twitter.username and the X link

links:
  scholar: https://scholar.google.com/citations?user=eGmhzDoAAAAJ
  github: https://github.com/hannapalya
  linkedin: https://www.linkedin.com/in/hanna-palya
  x: https://x.com/hannapalya5

# The jellyfish's bell is a secret link, like the stars in _data/stars.yml: it looks the same until
# you hover over it or tab to it, when its glow brightens and the label shows beside it. Keep the
# label short and lowercase.
jellyfish:
  label: moon jelly
  url: https://en.wikipedia.org/wiki/Aurelia_aurita

social:
  name: Hanna Pálya
  links:
    - https://scholar.google.com/citations?user=eGmhzDoAAAAJ
    - https://github.com/hannapalya
    - https://www.linkedin.com/in/hanna-palya
    - https://x.com/hannapalya5

twitter:
  username: hannapalya5
  card: summary_large_image

permalink: /blog/:year/:title/
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-feed
  - jekyll-redirect-from
  - jekyll-sitemap
  - jekyll-seo-tag

defaults:
  - scope:
      path: ""
    values:
      layout: page
      image: /assets/img/social-card.png
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - scripts/
  - docs/
  - vendor/
  - .bundle/
  - .jekyll-cache/
  - .sass-cache/
