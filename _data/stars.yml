# Stars that lead somewhere: some of the hand-drawn stars in the sky on the home page are secret
# links. A linked star looks like the others until you hover over it or tab to it; then it brightens
# and its label appears beside it. A click opens the link in the same tab.
#
# One entry per star, in priority order:
#
#   - label: as above                                            # shown beside the star: lowercase, a few words
#     url: "https://phoebebridgers.bandcamp.com/track/as-above"  # where it leads (keep the quotes)
#
# At most five, one for each star in clear sky. The first three are on every screen. The fourth shows
# on phones and on screens wider than about 1040px, the fifth only on screens about 1400px wide or
# more (it has room for a short label only). After editing, run scripts/check_site.py and
# scripts/check_layout.py, and look at the labels on a phone and on a wide screen: a long label can run
# into the text or the jellyfish.
#
# The jellyfish's bell is a secret link too. Its label and url are not here but under jellyfish: in
# _config.yml.
